name: "CodeQL Security Analysis"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '29 15 * * 4'  # Every Thursday at 15:29 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift' ]
        # Use only 'c-cpp' to analyze code written in C, C++, or Objective-C

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/apt
          /var/cache/apt
        key: codeql-ubuntu-deps-v2
        restore-keys: |
          codeql-ubuntu-deps-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          libpng++-dev \
          libunittest++-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          zlib1g-dev

    # Initializes the CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Override language selection by uncommenting this and choosing your languages
        # with:
        # languages: c-cpp, javascript
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        config: |
          paths:
            - src
            - include
          paths-ignore:
            - src/tests
            - examples
            - packages
          queries:
            - uses: security-and-quality
            - uses: security-extended

    # Build the project manually instead of using autobuild for better control
    - name: Build project
      run: |
        mkdir build && cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DLOMSE_BUILD_SHARED_LIB=ON \
          -DLOMSE_BUILD_STATIC_LIB=OFF \
          -DLOMSE_BUILD_TESTS=OFF \
          -DLOMSE_ENABLE_PNG=ON \
          -DLOMSE_ENABLE_COMPRESSION=ON \
          -DLOMSE_ENABLE_FONTCONFIG=ON \
          -DLOMSE_ENABLE_THREADS=ON \
          ..
        make -j$(nproc) lomse-shared

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        # Upload results to GitHub Security tab
        upload: true
