name: Performance and Memory Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2:00 AM UTC
  workflow_dispatch:     # Allow manual triggering

jobs:
  memory-tests:
    name: Memory Leak Detection
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt
            /var/cache/apt
          key: perf-ubuntu-deps-v1
          restore-keys: |
            perf-ubuntu-deps-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpng++-dev \
            libunittest++-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            zlib1g-dev \
            valgrind \
            heaptrack \
            massif-visualizer

      - name: Configure CMake (Debug with symbols)
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-g -O0 -fno-omit-frame-pointer" \
            -DLOMSE_BUILD_SHARED_LIB=ON \
            -DLOMSE_BUILD_STATIC_LIB=OFF \
            -DLOMSE_BUILD_TESTS=ON \
            -DLOMSE_RUN_TESTS=OFF \
            -DLOMSE_ENABLE_PNG=ON \
            -DLOMSE_ENABLE_COMPRESSION=ON \
            -DLOMSE_ENABLE_FONTCONFIG=ON \
            -DLOMSE_ENABLE_THREADS=ON \
            ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run Valgrind memory tests
        run: |
          cd build
          # Run tests with valgrind to detect memory leaks
          valgrind \
            --tool=memcheck \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --verbose \
            --error-exitcode=1 \
            --suppressions=../scripts/valgrind.supp \
            --log-file=valgrind-memcheck.log \
            ./testlib 2>&1 | tee valgrind-output.txt || echo "Valgrind detected issues"

          # Check if there were any definite leaks
          if grep -q "definitely lost:" valgrind-memcheck.log; then
            echo "❌ Memory leaks detected!"
            grep "definitely lost:" valgrind-memcheck.log
            exit 1
          else
            echo "✅ No definite memory leaks found"
          fi

      - name: Run Valgrind heap profiling
        run: |
          cd build
          # Profile heap usage
          valgrind \
            --tool=massif \
            --time-unit=ms \
            --detailed-freq=1 \
            --max-snapshots=100 \
            --massif-out-file=massif.out \
            ./testlib > /dev/null 2>&1 || true

          # Convert massif output to text
          ms_print massif.out > massif-report.txt

      - name: Upload memory test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-test-results
          path: |
            build/valgrind-*.log
            build/valgrind-output.txt
            build/massif.out
            build/massif-report.txt
          retention-days: 30

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt
            /var/cache/apt
          key: perf-ubuntu-deps-v1
          restore-keys: |
            perf-ubuntu-deps-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpng++-dev \
            libunittest++-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            zlib1g-dev \
            perf-tools-unstable \
            time

      - name: Configure CMake (Optimized build)
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -march=native -DNDEBUG" \
            -DLOMSE_BUILD_SHARED_LIB=ON \
            -DLOMSE_BUILD_STATIC_LIB=OFF \
            -DLOMSE_BUILD_TESTS=ON \
            -DLOMSE_RUN_TESTS=OFF \
            -DLOMSE_ENABLE_PNG=ON \
            -DLOMSE_ENABLE_COMPRESSION=ON \
            -DLOMSE_ENABLE_FONTCONFIG=ON \
            -DLOMSE_ENABLE_THREADS=ON \
            ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Create performance test script
        run: |
          cat > performance_test.sh << 'EOF'
          #!/bin/bash
          cd build

          echo "=== Performance Benchmark Report ===" > perf-report.txt
          echo "Date: $(date)" >> perf-report.txt
          echo "System: $(uname -a)" >> perf-report.txt
          echo "CPU: $(lscpu | grep "Model name" | cut -d: -f2 | xargs)" >> perf-report.txt
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')" >> perf-report.txt
          echo "" >> perf-report.txt

          # Warm up run
          echo "Running warm-up..."
          ./testlib > /dev/null 2>&1

          # Performance measurement runs
          echo "=== Test Execution Times ===" >> perf-report.txt
          for i in {1..5}; do
            echo "Run $i:"
            /usr/bin/time -f "Real: %e seconds, CPU: %P, Max RSS: %M KB" ./testlib 2>&1 | grep -E "(Real:|seconds)" >> perf-report.txt
            sleep 1
          done

          # Calculate averages
          echo "" >> perf-report.txt
          echo "=== Performance Summary ===" >> perf-report.txt

          # Extract times and calculate average
          times=$(grep "Real:" perf-report.txt | awk '{print $2}' | tr '\n' ' ')
          if [ -n "$times" ]; then
            avg_time=$(echo "$times" | awk '{sum=0; for(i=1;i<=NF;i++) sum+=$i; print sum/NF}')
            echo "Average execution time: ${avg_time} seconds" >> perf-report.txt

            # Performance thresholds (adjust as needed)
            if (( $(echo "$avg_time > 60" | bc -l) )); then
              echo "⚠️  WARNING: Tests taking longer than expected (>60s)" >> perf-report.txt
            else
              echo "✅ Performance within acceptable limits" >> perf-report.txt
            fi
          fi

          cat perf-report.txt
          EOF
          chmod +x performance_test.sh

      - name: Run performance benchmarks
        run: ./performance_test.sh

      - name: Check for performance regressions
        run: |
          cd build
          # Simple performance regression check
          avg_time=$(grep "Average execution time:" perf-report.txt | awk '{print $4}')
          if [ -n "$avg_time" ] && (( $(echo "$avg_time > 120" | bc -l) )); then
            echo "❌ Performance regression detected! Tests taking too long: ${avg_time}s"
            exit 1
          else
            echo "✅ Performance within acceptable limits: ${avg_time}s"
          fi

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            build/perf-report.txt
          retention-days: 30

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt
            /var/cache/apt
          key: static-ubuntu-deps-v1
          restore-keys: |
            static-ubuntu-deps-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpng++-dev \
            libunittest++-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            zlib1g-dev \
            cppcheck \
            clang-tidy \
            iwyu

      - name: Run cppcheck static analysis
        run: |
          mkdir -p static-analysis
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --xml \
            --xml-version=2 \
            src/ include/ \
            2> static-analysis/cppcheck-results.xml || echo "Cppcheck found issues"

          # Convert XML to readable format
          cppcheck \
            --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            src/ include/ \
            2> static-analysis/cppcheck-results.txt || echo "Cppcheck found issues"

      - name: Run clang-tidy analysis (sample)
        run: |
          # Configure and build to generate compile_commands.json
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLOMSE_BUILD_SHARED_LIB=ON \
            -DLOMSE_BUILD_STATIC_LIB=OFF \
            -DLOMSE_BUILD_TESTS=OFF \
            ..

          # Run clang-tidy on a subset of files (to avoid timeout)
          find ../src -name "*.cpp" -type f | head -20 | while read file; do
            echo "Analyzing: $file"
            clang-tidy "$file" -p . || echo "Issues found in $file"
          done > ../static-analysis/clang-tidy-results.txt 2>&1

      - name: Upload static analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-results
          path: |
            static-analysis/
          retention-days: 30

      - name: Comment analysis summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Static Analysis Summary" > analysis-summary.md
          echo "" >> analysis-summary.md

          if [ -f static-analysis/cppcheck-results.txt ]; then
            issue_count=$(wc -l < static-analysis/cppcheck-results.txt)
            echo "- **Cppcheck**: $issue_count potential issues found" >> analysis-summary.md
          fi

          echo "" >> analysis-summary.md
          echo "Full results are available in the uploaded artifacts." >> analysis-summary.md

          cat analysis-summary.md
